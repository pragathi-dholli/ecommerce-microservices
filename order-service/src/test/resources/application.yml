server:
  port: 0

spring:
  application:
    name: order-service-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

order:
  pending-timeout-minutes: 1
  timeout-check-interval-ms: 999999999

services:
  product:
    url: http://localhost:9999   # Will be mocked via @MockBean
  payment:
    url: http://localhost:9998

resilience4j:
  circuitbreaker:
    instances:
      productService:
        sliding-window-size: 4
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 1s
      paymentService:
        sliding-window-size: 4
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 1s

logging:
  level:
    com.ecommerce.order: DEBUG
