server:
  port: 0

spring:
  application:
    name: payment-service-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

services:
  order:
    url: http://localhost:9998  # Mocked in tests via @MockBean

payment:
  stale-processing-minutes: 1
  reconciliation-interval-ms: 999999999

resilience4j:
  circuitbreaker:
    instances:
      orderService:
        sliding-window-size: 4
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 1s

logging:
  level:
    com.ecommerce.payment: DEBUG
