server:
  port: 8083

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: PaymentServiceHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ── DOWNSTREAM SERVICES ───────────────────────────────────────────────────

services:
  order:
    url: ${ORDER_SERVICE_URL:http://localhost:8082}

# ── PAYMENT CONFIG ────────────────────────────────────────────────────────

payment:
  stale-processing-minutes: 10
  reconciliation-interval-ms: 300000

# ── RESILIENCE4J ──────────────────────────────────────────────────────────

resilience4j:
  circuitbreaker:
    instances:
      orderService:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s

  retry:
    instances:
      orderService:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2

  timelimiter:
    instances:
      orderService:
        timeout-duration: 5s

# ── FEIGN ─────────────────────────────────────────────────────────────────

feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 8000
        logger-level: BASIC
  circuitbreaker:
    enabled: true

# ── ACTUATOR ──────────────────────────────────────────────────────────────

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,prometheus
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

# ── LOGGING ───────────────────────────────────────────────────────────────

logging:
  level:
    com.ecommerce.payment: INFO
    io.github.resilience4j: DEBUG
    org.springframework.web: WARN
