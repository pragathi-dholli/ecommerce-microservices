name: Full Suite — CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  test-product-service:
    name: Product Service Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: product_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        working-directory: product-service
        run: mvn verify -B
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: product_db_test
          DB_USER: postgres
          DB_PASSWORD: postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-test-reports
          path: product-service/target/surefire-reports/

  test-order-service:
    name: Order Service Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: order_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        working-directory: order-service
        run: mvn verify -B
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: order_db_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          PRODUCT_SERVICE_URL: http://localhost:9999
          PAYMENT_SERVICE_URL: http://localhost:9998
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order-test-reports
          path: order-service/target/surefire-reports/

  test-payment-service:
    name: Payment Service Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: payment_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        working-directory: payment-service
        run: mvn verify -B
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: payment_db_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          ORDER_SERVICE_URL: http://localhost:9997
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-test-reports
          path: payment-service/target/surefire-reports/

  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [test-product-service, test-order-service, test-payment-service]
    steps:
      - run: echo "✅ All service tests passed — safe to merge"
